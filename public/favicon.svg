<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel terminal prompt favicon -->
  <rect width="16" height="16" fill="#000000"/>
  <g fill="#3fcb7f">
    <!-- Frame (1px, cut corners) -->
    <rect x="3" y="2" width="10" height="1"/>
    <rect x="3" y="13" width="10" height="1"/>
    <rect x="2" y="3" width="1" height="10"/>
    <rect x="13" y="3" width="1" height="10"/>
    <!-- Prompt “>” — thicker chevron, lower -->
    <rect x="4" y="7" width="2" height="1"/>
    <rect x="5" y="8" width="2" height="1"/>
    <rect x="6" y="9" width="2" height="1"/>
    <rect x="5" y="10" width="2" height="1"/>
    <rect x="4" y="11" width="2" height="1"/>
  </g>
</svg>
